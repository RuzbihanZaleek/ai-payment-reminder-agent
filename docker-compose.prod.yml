# Production compose. Start with:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Differences from the development docker-compose.yml:
#   - NO source bind mount: the built image is the single source of truth.
#   - PostgreSQL is NOT published to the host; it is reachable only over the
#     private Docker network.
#   - Explicit app-network and Docker log rotation on both services.

services:

  app:
    container_name: payment_reminder_api
    build:
      context: .
      dockerfile: Dockerfile

    # The API is the only publicly exposed port.
    expose:
      - "8000"

    env_file:
      - .env

    # Only start the API once the database is actually accepting connections.
    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - app-network

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"


  postgres:
    container_name: payment_reminder_db

    image: postgres:16

    # No host port: PostgreSQL is reachable only from other containers on
    # app-network (the `app` service connects via host "postgres").
    expose:
      - "5432"

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payment_reminder"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped

    networks:
      - app-network

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  cloudflared:

    image: cloudflare/cloudflared:latest

    container_name: payagent-tunnel

    # Token comes from the gitignored .env (never commit it). Rotate in the
    # Cloudflare dashboard if it is ever exposed.
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}

    restart: unless-stopped

    depends_on:
      app:
        condition: service_healthy

    networks:
      - app-network

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:

  postgres_data:


networks:

  app-network:
    driver: bridge
